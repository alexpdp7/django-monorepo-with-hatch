# Root pyproject.toml
[project]
name = "djmh"
version = "1.0.0"

[tool.hatch.envs.default]
workspace.members = ["packages/*"]
workspace.parallel = true
dependencies = ["pytest", "pytest-django"]

[tool.hatch.envs.dj]
workspace.members = ["packages/*"]
workspace.parallel = true
dependencies = ["pytest-django"]

[tool.hatch.envs.dj.env-vars]
DJANGO_SETTINGS_MODULE = "dj.settings"

[tool.pytest]
python_files = ["tests.py", "test_*.py", "*_test.py"]
DJANGO_SETTINGS_MODULE = "dj.settings"
